<html layout:decorate="~{layout}">
<div layout:fragment="content" class="container my-3">
    <form th:action="@{/article/list}" method="get" class="mb-3">
        <div class="input-group">
            <input type="text" name="keyword" th:value="${keyword}"
                   class="form-control" placeholder="검색어를 입력하세요">
            <button type="submit" class="btn btn-outline-secondary">검색</button>
        </div>
    </form>
    <table class="table">
        <thead class="table-dark">
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일시</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="article, loop : ${articleList}">
            <td th:text="${loop.count}"></td>
            <td>
                <a th:href="@{|/article/detail/${article.id}|}" th:text="${article.title}"></a>
            </td>
            <td th:text="${article.author.username}"></td>
            <td th:text="${#temporals.format(article.createDate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
    <button onclick="location.href='/article/create'">등록</button>
</div>
</html>
